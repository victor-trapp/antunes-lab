#cloud-config

install:
  device: "auto"
  auto: true
  reboot: true

hostname: "kairos-cp"

users:
  - name: "kairos"
    passwd: "kairos"
    groups:
      - "admin"
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAhQhJmHcBBBl8X/n/PcLeJMgKDx1w82DLMmt2YEMDVf trapp-ubuntu-lab"

k3s:
  enabled: true
  args:
    - "--disable=traefik"

# Hide the default login messages.
stages:
  boot:
    - name: "Quiet the default login banners"
      files:
        - path: /home/kairos/.hushlogin
          permissions: 0644
          owner: 1001
          group: 1001
          content: ""
